name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler

      - name: Verify sources and tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --locked
          ./gradlew check

      - name: Prepare registry packages
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: ./scripts/package-release.sh "${RELEASE_VERSION#v}" "$RELEASE_VERSION"

      - name: Collect GitHub Release artifacts
        run: |
          mkdir -p release-artifacts
          find java \
            -path '*/build/libs/*.jar' \
            -type f \
            ! -path '*/moonlight-bridge-example-api/*' \
            -exec cp {} release-artifacts/ \;
          (cd release-artifacts && sha256sum ./*.jar > SHA256SUMS)

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moonlightbridge-${{ github.ref_name }}
          path: release-artifacts/
          if-no-files-found: error

  publish-rust:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    steps:
      - name: Check out release tag
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish crates.io packages in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: ./scripts/publish-crates.sh "${RELEASE_VERSION#v}"

  publish-java-github:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publishJavaToGitHubPackages

  publish-java-central:
    if: ${{ vars.MAVEN_CENTRAL_ENABLED == 'true' }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    steps:
      - name: Check out release tag
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: ./gradlew publishJavaToMavenCentral

  github-release:
    needs: [verify, publish-rust, publish-java-github]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v5

      - name: Download verified artifacts
        uses: actions/download-artifact@v4
        with:
          name: moonlightbridge-${{ github.ref_name }}
          path: release-artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" release-artifacts/* --verify-tag --generate-notes --title "MoonLightBridge $GITHUB_REF_NAME"
