name: Retry Java GitHub Packages

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-java-github:
    if: ${{ startsWith(inputs.release_ref, 'v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out requested release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_ref }}

      - name: Verify immutable release tag
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: ./scripts/check-release-version.sh "${RELEASE_REF#v}" "$RELEASE_REF"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: ./gradlew publishJavaToGitHubPackages
