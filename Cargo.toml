[workspace]
members = [
    "crates/moonlight-bridge-protocol",
    "crates/moonlight-bridge-server",
    "crates/moonlight-bridge-example-api",
    "crates/moonlight-bridge-codegen",
    "crates/moonlight-bridge-sentry",
    "examples/example-backend",
    "examples/test-plugin-backend",
]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["~VicTim~"]
homepage = "https://dev.moonlightproject.ru"
repository = "https://github.com/MoonL1ghtProject/MoonLightBridge"
readme = "README.md"
keywords = ["java", "rpc", "paper", "protobuf", "networking"]
categories = ["network-programming", "asynchronous"]

[workspace.dependencies]
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "io-util", "sync", "time"] }
tokio-rustls = "0.26.5"
rustls = { version = "0.23.45", default-features = false, features = ["std", "tls12"] }
prost = "0.14.4"
prost-build = "0.14.4"
prost-types = "0.14.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
futures-core = "0.3"
futures-util = "0.3"
sentry = { version = "0.49.2", default-features = false, features = ["reqwest", "rustls", "contexts", "logs"] }
sentry-tracing = { version = "0.49.2", features = ["logs"] }
