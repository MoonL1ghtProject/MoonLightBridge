[package]
name = "moonlight-bridge-observability-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

# A consumer example: it uses the published MoonLightBridge crates, never workspace sources.
[dependencies]
moonlight = { package = "moonlight-bridge-contract", version = "0.6.1" }
moonlight-bridge-protocol = "0.6.1"
moonlight-bridge-server = "0.6.1"
moonlight-bridge-observability = { version = "0.6.1", features = ["prometheus", "otel", "otlp"] }
opentelemetry.workspace = true
prost.workspace = true
tokio.workspace = true

[build-dependencies]
moonlight-bridge-codegen = "0.6.1"
prost-build.workspace = true
