name: MoonLightLoadTestPlugin
version: '${version}'
main: ru.moonlightproject.bridge.examples.paper.load.MoonLightLoadTestPlugin
description: Controlled MoonLightBridge Java-to-Rust load generator
website: https://dev.moonlightproject.ru
api-version: '1.21'
folia-supported: true
authors: ["~VicTim~"]
commands:
  moonlightload:
    description: Run a bounded MoonLightBridge RPC load test
    usage: /moonlightload [requests] [concurrency] [payload-bytes]
    permission: moonlightbridge.load
permissions:
  moonlightbridge.load:
    description: Allows MoonLightBridge load tests
    default: op
