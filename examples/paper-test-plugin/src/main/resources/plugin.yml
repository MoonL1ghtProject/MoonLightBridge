name: MoonLightTestPlugin
version: '${version}'
main: ru.moonlightproject.bridge.examples.paper.MoonLightTestPlugin
description: End-to-end MoonLightBridge Java-to-Rust test plugin
website: https://dev.moonlightproject.ru
api-version: '1.21'
folia-supported: true
authors: ["~VicTim~"]
commands:
  moonlighttest:
    description: Send one typed RPC to the MoonLightBridge Rust backend
    usage: /moonlighttest <text>
    permission: moonlightbridge.test
  moonlightbatch:
    description: Send a batch of typed RPCs to the MoonLightBridge Rust backend
    usage: /moonlightbatch <count> <text>
    permission: moonlightbridge.test
permissions:
  moonlightbridge.test:
    description: Allows use of the MoonLightBridge test commands
    default: op
