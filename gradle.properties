version=0.6.1
group=ru.moonlightproject

# Released MoonLightBridge that the examples consume from Maven Central and crates.io. Examples
# never build against the sources in this repository.
publishedMoonLightBridgeVersion=0.6.0

# Independent modules build and publish concurrently; outputs are reused across tasks.
org.gradle.parallel=true
